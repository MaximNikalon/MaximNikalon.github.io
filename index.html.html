<body>
<div class="hud"><h1>CHRISTMAS EVE</h1><p>A COZY CABIN · VAN GOGH INSPIRED OIL PAINTING</p></div>
<div class="tip">DRAG TO ROTATE · SCROLL TO ZOOM</div>

<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// ============================================================
// Scene — warm Christmas Eve light inside a painted Starry Night
// ============================================================
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x18284c);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,120);
camera.position.set(6.6,5.5,8.9);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.34;
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.045;
controls.autoRotate=true;
controls.autoRotateSpeed=.27;
controls.minDistance=6.5;
controls.maxDistance=14;
controls.target.set(0,2.55,.25);
controls.maxPolarAngle=Math.PI*.49;

scene.add(new THREE.HemisphereLight(0xc4d6ef,0x754b35,1.25));
const moonFill=new THREE.DirectionalLight(0x9db9e4,1.25);
moonFill.position.set(-6,9,-7);scene.add(moonFill);
const hearthLight=new THREE.PointLight(0xff9c4b,75,19,1.6);
hearthLight.position.set(-4.2,1.9,2.5);scene.add(hearthLight);
const warmBounce=new THREE.PointLight(0xffc16b,38,14,1.8);
warmBounce.position.set(2.4,3.0,4.2);scene.add(warmBounce);
const softGold=new THREE.PointLight(0xffd991,18,12,1.8);
softGold.position.set(0,4.8,1.2);scene.add(softGold);

const C={
 night:0x17264a,navy:0x203b67,blue:0x315b82,blueLight:0x6f91ad,
 deep:0x103e3d,forest:0x145247,teal:0x1b6c60,
 green:0x287c5b,emerald:0x3a966e,mint:0x8dbb98,
 leafLight:0xb2c69c,cream:0xf0dfb6,
 gold:0xe5ad4e,goldLight:0xffdf91,
 red:0xb8323d,redLight:0xe35a50,rose:0xc86b83,
 purple:0x70527e,brown:0x70452e
};
const material=(color,rough=.9,metal=.0,emissive=0x000000,intensity=0)=>
 new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,emissive,emissiveIntensity:intensity,flatShading:true});

function rand(a,b){return a+Math.random()*(b-a)}
function addMesh(parent,geo,mat,pos=[0,0,0]){
 const m=new THREE.Mesh(geo,mat);m.position.set(...pos);parent.add(m);return m;
}

// ============================================================
// Painterly 360° background texture: swirling blue sky, stars,
// moonlight and a little hearth vignette painted into the scene.
// ============================================================
function makeSkyPainting(){
 const c=document.createElement('canvas');c.width=2048;c.height=1024;
 const ctx=c.getContext('2d');
 const g=ctx.createLinearGradient(0,0,0,1024);
 g.addColorStop(0,'#172957');g.addColorStop(.48,'#294b72');g.addColorStop(1,'#182b49');
 ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);

 // Broad impasto sky strokes in sweeping, curved directions.
 const skyColors=['#345e88','#426f91','#203f70','#557e9b','#243d68','#66879a','#8a927e'];
 for(let layer=0;layer<5;layer++){
  for(let i=0;i<150;i++){
   const x=rand(-100,2148),y=rand(40,760);
   const len=rand(45,190),amp=rand(8,32);
   const a=rand(-.2,.2);
   ctx.beginPath();
   ctx.moveTo(x,y);
   ctx.bezierCurveTo(x+len*.25,y-amp,x+len*.7,y+amp,x+len,y+rand(-8,8));
   ctx.strokeStyle=skyColors[Math.floor(Math.random()*skyColors.length)];
   ctx.lineWidth=rand(3,12);ctx.lineCap='round';ctx.globalAlpha=rand(.20,.55);
   ctx.stroke();
  }
 }
 ctx.globalAlpha=1;

 // Giant Starry Night-like spirals.
 for(let s=0;s<5;s++){
  const cx=[300,780,1270,1710,1920][s],cy=[250,170,340,180,430][s];
  for(let k=0;k<5;k++){
   ctx.beginPath();
   for(let j=0;j<=150;j++){
    const t=j/150*Math.PI*2.4;
    const r=18+t*(15+k*2);
    const x=cx+Math.cos(t+s*.8)*r;
    const y=cy+Math.sin(t+s*.8)*r*.52;
    if(j===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
   }
   ctx.strokeStyle=k%2?'#7897a5':'#e0c77d';
   ctx.lineWidth= k===0?7:rand(2,5);ctx.globalAlpha=.28+k*.045;ctx.stroke();
  }
 }
 ctx.globalAlpha=1;

 // Stars with painted halos and hand-brushed rays.
 for(let i=0;i<85;i++){
  const x=rand(30,2018),y=rand(35,610),r=rand(3,10);
  const halo=ctx.createRadialGradient(x,y,0,x,y,r*5);
  halo.addColorStop(0,'rgba(255,225,151,.48)');
  halo.addColorStop(1,'rgba(255,225,151,0)');
  ctx.fillStyle=halo;ctx.beginPath();ctx.arc(x,y,r*5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=i%3?'#e8dcae':'#fff0bd';
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#e9d49b';ctx.lineWidth=2;ctx.globalAlpha=.65;
  ctx.beginPath();ctx.moveTo(x-r*2.5,y);ctx.lineTo(x+r*2.5,y);ctx.moveTo(x,y-r*2.5);ctx.lineTo(x,y+r*2.5);ctx.stroke();
  ctx.globalAlpha=1;
 }

 // Low horizon: painterly silhouettes of distant winter houses.
 for(let i=0;i<24;i++){
  const x=i*95-40,base=880+rand(-25,25),w=rand(45,100),h=rand(55,145);
  ctx.fillStyle=i%2?'#172b45':'#203b55';
  ctx.fillRect(x,base-h,w,h);
  ctx.fillStyle='#e6a65c';ctx.globalAlpha=.6;
  for(let wx=x+10;wx<x+w-8;wx+=22){
   ctx.fillRect(wx,base-h+22,8,13);
  }
  ctx.globalAlpha=1;
 }
 // Painted fireplace at the right side of the panorama.
 const fx=1590,fy=850;
 ctx.fillStyle='#513e43';ctx.fillRect(fx-155,fy-190,310,220);
 ctx.fillStyle='#89614e';ctx.fillRect(fx-132,fy-168,264,195);
 ctx.fillStyle='#1d263c';ctx.fillRect(fx-105,fy-145,210,172);
 // Warm fire glow.
 const fireGlow=ctx.createRadialGradient(fx,fy-55,5,fx,fy-55,260);
 fireGlow.addColorStop(0,'rgba(255,205,112,.85)');
 fireGlow.addColorStop(.35,'rgba(232,117,57,.32)');
 fireGlow.addColorStop(1,'rgba(232,117,57,0)');
 ctx.fillStyle=fireGlow;ctx.fillRect(fx-270,fy-330,540,420);
 // Painted flame strokes.
 for(let i=0;i<34;i++){
  const x=fx+rand(-78,78),y=fy+rand(-125,-35);
  ctx.beginPath();ctx.moveTo(x,y+50);
  ctx.quadraticCurveTo(x+rand(-40,40),y+rand(-35,15),x+rand(-18,18),y-65-rand(0,45));
  ctx.strokeStyle=i%3?'#e66d3e':'#ffd77b';
  ctx.lineWidth=rand(5,15);ctx.lineCap='round';ctx.globalAlpha=rand(.45,.85);ctx.stroke();
 }
 ctx.globalAlpha=1;
 // Fire-side brushy stone strokes.
 for(let i=0;i<75;i++){
  const x=fx+rand(-175,175),y=fy+rand(-210,45);
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+rand(-22,22),y+rand(-4,7));
  ctx.strokeStyle=i%2?'#b27b56':'#d6a16b';ctx.lineWidth=rand(2,7);ctx.globalAlpha=.4;ctx.stroke();
 }
 ctx.globalAlpha=1;

 // Varnish-like fine brush flecks across the entire painting.
 for(let i=0;i<2800;i++){
  const x=rand(0,c.width),y=rand(0,c.height);
  ctx.strokeStyle=i%3?'#d5c49a':'#7fa1ac';
  ctx.globalAlpha=rand(.025,.12);ctx.lineWidth=rand(.5,2);
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+rand(2,12),y+rand(-2,2));ctx.stroke();
 }
 ctx.globalAlpha=1;
 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
 tex.wrapS=THREE.RepeatWrapping;tex.anisotropy=4;
 return tex;
}
const skyTexture=makeSkyPainting();
const sky=addMesh(scene,new THREE.SphereGeometry(42,64,40),
 new THREE.MeshBasicMaterial({map:skyTexture,side:THREE.BackSide}),[0,0,0]);

// A painted floor with loose blue/ochre brush marks.
function makeFloorTexture(){
 const c=document.createElement('canvas');c.width=1024;c.height=1024;
 const ctx=c.getContext('2d');
 ctx.fillStyle='#293e5b';ctx.fillRect(0,0,1024,1024);
 const cols=['#375a70','#4b6872','#8a7259','#c08a56','#344d67','#6f796e'];
 for(let i=0;i<1800;i++){
  const x=rand(0,1024),y=rand(0,1024),len=rand(10,80);
  ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+len*.5,y+rand(-12,12),x+len,y+rand(-8,8));
  ctx.strokeStyle=cols[Math.floor(Math.random()*cols.length)];
  ctx.globalAlpha=rand(.08,.28);ctx.lineWidth=rand(2,8);ctx.lineCap='round';ctx.stroke();
 }
 ctx.globalAlpha=1;
 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;return tex;
}
const floor=addMesh(scene,new THREE.PlaneGeometry(13.0,9.6),
 new THREE.MeshStandardMaterial({map:makeFloorTexture(),roughness:1}),[0,-.62,0]);
floor.rotation.x=-Math.PI/2;

// ============================================================
// 3D oil-paint brush strokes — tapered, curved, raised ribbons.
// No cone shells: foliage itself is built from flowing strokes.
// ============================================================
const tree=new THREE.Group();scene.add(tree);

function brushRibbon(parent,points,width,color,opts={}){
 const pts=points.map(p=>new THREE.Vector3(...p));
 const curve=new THREE.CatmullRomCurve3(pts);
 const steps=opts.steps||9;
 const vertices=[],indices=[],uvs=[];
 const up=new THREE.Vector3(0,1,0);
 for(let i=0;i<=steps;i++){
  const t=i/steps;
  const p=curve.getPoint(t);
  const tangent=curve.getTangent(t).normalize();
  let side=new THREE.Vector3().crossVectors(tangent,up).normalize();
  if(side.length()<.1)side.set(1,0,0);
  let normal=new THREE.Vector3().crossVectors(side,tangent).normalize();
  const radial=new THREE.Vector3(p.x,0,p.z).normalize();
  if(normal.dot(radial)<0)normal.negate();
  const taper=Math.pow(Math.sin(Math.PI*Math.max(.001,t)),opts.taper||.72);
  const wav=1+.12*Math.sin(t*19+(opts.phase||0))+.05*Math.sin(t*37);
  const w=width*taper*wav;
  const ridge=opts.ridge||.018;
  const left=p.clone().addScaledVector(side,-w);
  const mid=p.clone().addScaledVector(normal,ridge);
  const right=p.clone().addScaledVector(side,w);
  vertices.push(left.x,left.y,left.z,mid.x,mid.y,mid.z,right.x,right.y,right.z);
  uvs.push(0,t,.5,t,1,t);
  if(i>0){
   const a=(i-1)*3,b=i*3;
   indices.push(a,b,a+1,a+1,b,b+1,a+1,b+1,a+2,a+2,b+1,b+2);
  }
 }
 const geo=new THREE.BufferGeometry();
 geo.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
 geo.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
 geo.setIndex(indices);geo.computeVertexNormals();
 const mesh=new THREE.Mesh(geo,material(color,opts.roughness??.96,0,opts.emissive||0,opts.emissiveIntensity||0));
 parent.add(mesh);
 return mesh;
}

function paintStrokeLine(parent,points,color,r=.018){
 const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
 const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,12,r,4,false),
   material(color,.98));
 parent.add(mesh);return mesh;
}

// ============================================================
// Trunk — visible painterly strokes, not a smooth cylinder
// ============================================================
const trunkBase=addMesh(tree,new THREE.CylinderGeometry(.19,.30,1.18,9),
 material(C.brown,1),[0,.03,0]);
for(let i=0;i<28;i++){
 const a=i/28*Math.PI*2,rad=.23;
 const x=Math.cos(a)*rad,z=Math.sin(a)*rad;
 brushRibbon(tree,[
  [x,-.52,z],[x+.025,-.20,z+.02],[x-.02,.12,z-.02],[x+.015,.58,z]
 ],rand(.018,.04),i%4===0?0xb48b55:(i%2?0x4d382d:0x8a5a37),
 {steps:7,ridge:.012});
}

// ============================================================
// Foliage: soft, dense, overlapping curved brush clusters.
// Each tier is irregular and fluffy, with curled leaf strokes.
// ============================================================
const greenTier=[0x0d403b,0x14564b,0x17675a,0x1f765c,0x2d8966,0x3e9a70,0x6ea783,0x91b58c,0xb1bd93,0x315f70,0x426f7c];
const pinkTier=[0x7b516f,0x915b79,0xa05c79,0xc07886,0xd68aa1,0xe1b0bb,0xb08b98,0x8b677f];
const highlightTier=[0xc3c69e,0xb1bd93,0x8ea98b,0xf0dfb6];
const tierPalettes=[
 {main:greenTier, accent:highlightTier},
 {main:pinkTier, accent:[0xe6cfab,0xd89fb0,0xc47a91]},
 {main:greenTier, accent:highlightTier},
 {main:pinkTier, accent:[0xe7d4af,0xd38ca3,0xb5718d]},
 {main:greenTier, accent:[0xf0dfb6,0xa7ba95,0x81a786]}
];
const tiers=[
 {y:4.62,r:.92,drop:.82,count:30,topFill:22},
 {y:3.84,r:1.34,drop:.88,count:32,topFill:18},
 {y:2.96,r:1.82,drop:.94,count:34,topFill:12},
 {y:2.04,r:2.24,drop:.98,count:37,topFill:8},
 {y:1.15,r:2.54,drop:.90,count:40,topFill:6}
];

tiers.forEach((T,ti)=>{
 const phase=ti*.21;
 const palette=tierPalettes[ti];
 for(let b=0;b<T.count;b++){
  const a=b/T.count*Math.PI*2+phase+rand(-.035,.035);
  const ca=Math.cos(a),sa=Math.sin(a);
  const outer=T.r*rand(.91,1.08);
  const startR=rand(.08,.22);
  const endY=T.y-T.drop*rand(.83,1.06);
  const mainColor=palette.main[Math.floor(Math.random()*palette.main.length)];
  // Main flowing bough, curved down like a painted branch.
  const mainPts=[
   [ca*startR,T.y+rand(-.04,.10),sa*startR],
   [ca*(outer*.34),T.y-T.drop*.12,sa*(outer*.34)],
   [ca*(outer*.69),T.y-T.drop*.43,sa*(outer*.69)],
   [ca*outer,endY,sa*outer]
  ];
  brushRibbon(tree,mainPts,rand(.075,.125),mainColor,{steps:12,ridge:.035,phase:rand(0,8)});

  // Layered leaf clusters fan off both sides of the branch.
  const sprays=ti<2?4:5;
  for(let s=0;s<sprays;s++){
   const t=.24+s*.145+rand(-.025,.025);
   const rr=startR+(outer-startR)*t;
   const yy=T.y-T.drop*t*.72;
   for(const side of [-1,1]){
    const sideAngle=a+side*rand(.12,.28);
    const len=rand(.25,.52)*(0.85+ti*.06);
    const tipR=rr+len*.74;
    const tipY=yy-rand(.12,.34);
    const leafPalette = Math.random() > .26 ? palette.main : palette.accent;
    const color = leafPalette[Math.floor(Math.random() * leafPalette.length)];
    const leafPts=[
     [ca*rr,yy,sa*rr],
     [Math.cos(sideAngle)*(rr+len*.32),yy+.05,Math.sin(sideAngle)*(rr+len*.32)],
     [Math.cos(sideAngle+.035*side)*(rr+len*.75),tipY+.04,Math.sin(sideAngle+.035*side)*(rr+len*.75)],
     [Math.cos(sideAngle+.08*side)*tipR,tipY-rand(.025,.09),Math.sin(sideAngle+.08*side)*tipR]
    ];
    brushRibbon(tree,leafPts,rand(.045,.09),color,{steps:9,ridge:.025,phase:rand(0,6)});
    // A thin, offset paint ridge gives the leaf a hand-loaded brush highlight.
    if(Math.random()>.42){
     const hi=leafPts.map((p,i)=>[p[0]*1.008,p[1]+.018,p[2]*1.008]);
     brushRibbon(tree,hi,rand(.009,.018),Math.random()>.5?0x9ab98e:0xc3c69e,
       {steps:7,ridge:.009,taper:.9});
    }
   }
  }

  // A loose curl at the tip — a Van Gogh-like turning leaf mark.
  const curlR=outer*.78;
  const curlPts=[];
  for(let q=0;q<5;q++){
   const t=q/4;
   const aa=a+.12+Math.sin(t*Math.PI)*.13;
   const rr=curlR+t*.34;
   curlPts.push([Math.cos(aa)*rr,endY+.12*Math.sin(t*Math.PI)-t*.08,Math.sin(aa)*rr]);
  }
  const curlPalette = Math.random() > .22 ? palette.main : palette.accent;
  brushRibbon(tree,curlPts,rand(.025,.05),
    curlPalette[Math.floor(Math.random() * curlPalette.length)],
    {steps:9,ridge:.018,taper:.85});
 }

 // Extra crown foliage so the top view feels full and layered.
 for(let c=0;c<T.topFill;c++){
  const a=c/T.topFill*Math.PI*2+phase*.7+rand(-.08,.08);
  const rr=T.r*rand(.18,.78);
  const y=T.y-rand(.06,T.drop*.45);
  const len=rand(.12,.26);
  const pts=[
    [Math.cos(a)*rr,y,Math.sin(a)*rr],
    [Math.cos(a+.08)*(rr+len*.28),y+.04,Math.sin(a+.08)*(rr+len*.28)],
    [Math.cos(a+.16)*(rr+len*.60),y-rand(.02,.09),Math.sin(a+.16)*(rr+len*.60)]
  ];
  const col=(c%3===0?palette.accent:palette.main)[Math.floor(Math.random()*((c%3===0?palette.accent:palette.main).length))];
  brushRibbon(tree,pts,rand(.028,.055),col,{steps:6,ridge:.016,taper:.82});
 }
});

// Fill the spaces between tiers with smaller loose curved paint marks.
// They create soft volume without a solid cone underneath.
for(let i=0;i<360;i++){
 const y=rand(.88,4.82);
 const maxR=2.62*(1-(y-.82)/4.35);
 const r=rand(.28,Math.max(.34,maxR));
 const a=rand(0,Math.PI*2);
 const len=rand(.13,.38);
 const aa=a+rand(-.18,.18);
 const fillTierIndex = Math.max(0, Math.min(tierPalettes.length - 1,
   Math.round((4.62 - y) / (4.62 - 1.15) * (tierPalettes.length - 1))));
 const fillTierPalette = tierPalettes[fillTierIndex];
 const fillColors = Math.random() > .24 ? fillTierPalette.main : fillTierPalette.accent;
 const color = fillColors[Math.floor(Math.random() * fillColors.length)];
 const pts=[
  [Math.cos(a)*r,y,Math.sin(a)*r],
  [Math.cos(aa)*(r+len*.35),y+rand(-.04,.08),Math.sin(aa)*(r+len*.35)],
  [Math.cos(aa+.08)*(r+len),y-rand(.04,.17),Math.sin(aa+.08)*(r+len)]
 ];
 brushRibbon(tree,pts,rand(.022,.06),color,{steps:7,ridge:.018,taper:.75});
}

// A few larger swirling impasto strokes across the foliage.
for(let i=0;i<95;i++){
 const y=rand(1.05,4.45);
 const maxR=2.5*(1-(y-1)/4.2);
 const r=rand(.4,Math.max(.5,maxR));
 const a=rand(0,Math.PI*2);
 const pts=[];
 for(let j=0;j<5;j++){
  const t=j/4;
  const aa=a+t*.38;
  const rr=r+t*rand(.13,.21);
  pts.push([Math.cos(aa)*rr,y+Math.sin(t*Math.PI)*.10-t*.08,Math.sin(aa)*rr]);
 }
 const swirlTierIndex = Math.max(0, Math.min(tierPalettes.length - 1,
   Math.round((4.62 - y) / (4.62 - 1.15) * (tierPalettes.length - 1))));
 const swirlPalette = tierPalettes[swirlTierIndex];
 const swirlColors = swirlTierIndex % 2 === 1
   ? [0xe4c5b3,0xd68ca5,0xb4768e,0x8d6c89,0xf0dfb6]
   : [0x78a98e,0x9cb98e,0xc1bd91,0x477f83,0x6c6380];
 brushRibbon(tree,pts,rand(.018,.042),swirlColors[i%swirlColors.length],
  {steps:9,ridge:.018,taper:.9});
}

// ============================================================
// Painterly spiral garland with tiny glowing bulbs
// ============================================================
function radiusAt(y){
 const profile=[[.55,2.52],[1.15,2.50],[2.02,2.22],[2.92,1.78],[3.78,1.28],[4.55,.82],[5.0,.35]];
 for(let i=0;i<profile.length-1;i++){
  const [y1,r1]=profile[i],[y2,r2]=profile[i+1];
  if(y>=y1&&y<=y2){const t=(y-y1)/(y2-y1);return r1+(r2-r1)*t;}
 }
 return y<.55?2.5:.25;
}
function tube(parent,points,r,color,emissive=0x000000,intensity=0){
 const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
 const mesh=addMesh(parent,new THREE.TubeGeometry(curve,Math.max(24,points.length*3),r,7,false),
  material(color,.58,.12,emissive,intensity));
 return mesh;
}
for(let g=0;g<2;g++){

 for(let i=0;i<=220;i++){
  const t=i/220,y=.72+t*4.25,a=t*Math.PI*2*(g===0?3.1:2.45)+g*2.1;
  const r=radiusAt(y)+.055*Math.sin(t*22+g);
  pts.push([Math.cos(a)*r,y,Math.sin(a)*r]);
 }
 tube(tree,pts,.035,C.gold,0x9d641f,.16);
}

function makeGlowTexture(){
 const c=document.createElement('canvas');c.width=128;c.height=128;
 const ctx=c.getContext('2d');
 const g=ctx.createRadialGradient(64,64,2,64,64,62);
 g.addColorStop(0,'rgba(255,248,210,1)');
 g.addColorStop(.12,'rgba(255,215,135,.72)');
 g.addColorStop(.38,'rgba(255,169,83,.25)');
 g.addColorStop(1,'rgba(255,145,70,0)');
 ctx.fillStyle=g;ctx.fillRect(0,0,128,128);
 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;return tex;
}
const glowTexture=makeGlowTexture();
function glowSprite(parent,x,y,z,size,color=0xffc879,opacity=.9){
 const sm=new THREE.SpriteMaterial({map:glowTexture,color,transparent:true,opacity,
  blending:THREE.AdditiveBlending,depthWrite:false});
 const s=new THREE.Sprite(sm);s.position.set(x,y,z);s.scale.set(size,size,size);parent.add(s);return s;
}

// Classic Santa hat: one continuous curved velvet cap,

const hat=new THREE.Group();

const hatBaseY=4.98;

// Continuous tapered cap surface with a relaxed sideways droop.
const hatVertices=[];
const hatIndices=[];
const hatSegments=48;
const hatRings=28;
for(let iy=0;iy<=hatRings;iy++){
  const t=iy/hatRings;
  const y=hatBaseY+1.08*t;
  const centerX=.34*t+.055*Math.sin(Math.PI*t);
  const centerZ=.035*Math.sin(Math.PI*t);
  const radius=.405*Math.pow(1-t,.88)+.004;
  for(let j=0;j<=hatSegments;j++){
    const a=j/hatSegments*Math.PI*2;
    const wobble=1+.018*Math.sin(a*5+t*7);
    const r=radius*wobble;
    hatVertices.push(
      centerX+Math.cos(a)*r,
      y,
      centerZ+Math.sin(a)*r
    );
    if(iy<hatRings&&j<hatSegments){
      const k=iy*(hatSegments+1)+j;
      hatIndices.push(
        k,k+hatSegments+1,k+1,
        k+1,k+hatSegments+1,k+hatSegments+2
      );
    }
  }
}
const hatGeometry=new THREE.BufferGeometry();
hatGeometry.setAttribute("position",new THREE.Float32BufferAttribute(hatVertices,3));
hatGeometry.setIndex(hatIndices);
hatGeometry.computeVertexNormals();
const velvetMaterial=new THREE.MeshStandardMaterial({
  color:0xc83b45,
  roughness:.88,
  metalness:0,
  side:THREE.DoubleSide
});

 {steps:6,ridge:.018,taper:.8});
 if(i%5===0){
  addMesh(mantelGarland,new THREE.SphereGeometry(.055,8,7),
   material(i%2?0xc9413e:0xd7a64f,.45,.05,0x9d3c20,.18),
   [x,y-.10,z+.04]);
 }
}

// Candles on the mantel.
function makeCandle(parent,x,y,z,height,color){
 const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);
 addMesh(g,new THREE.CylinderGeometry(.095,.11,height,12),
  material(color,.88),[0,height/2,0]);
 // melted wax rim
 addMesh(g,new THREE.TorusGeometry(.09,.018,6,16),
  material(0xf6dfb5,.9),[0,height*.91,0]);
 paintStrokeLine(g,[[0,height*.92,0],[.015,height*1.02,0]],0x3d3027,.012);
 const flame=addMesh(g,new THREE.SphereGeometry(.055,10,8),
  new THREE.MeshBasicMaterial({color:0xffc66c}),[0,height*1.12,0]);
 glowSprite(g,0,height*1.12,0,.85,0xffbd61,.72);
 return g;
}
makeCandle(fireplace,-1.10,3.23,.78,.38,0xf0dfbd);
makeCandle(fireplace,1.12,3.23,.78,.48,0xd8c7a7);

// Stockings hanging from the mantel.
function makeStocking(parent,x,y,z,color,flip=1){
 const g=new THREE.Group();g.position.set(x,y,z);g.scale.x=flip;parent.add(g);
 const sockMat=material(color,.92);
 // Soft stocking silhouette assembled from rounded painted shapes.
 addMesh(g,new THREE.CapsuleGeometry(.105,.43,5,9),sockMat,[0,-.28,0]);
 addMesh(g,new THREE.SphereGeometry(.15,10,8),sockMat,[.105,-.52,0]);
 addMesh(g,new THREE.BoxGeometry(.24,.12,.16),material(0xf0e4cf,.98),[0,.015,.01]);
 brushRibbon(g,[[.02,-.16,.11],[.05,-.34,.13],[.16,-.48,.12]],.018,0xf1c9a5,{steps:6,ridge:.01});
}
makeStocking(fireplace,-.67,2.98,.76,0xb63e45,1);
makeStocking(fireplace,.67,2.98,.76,0x286c68,-1);

// A painterly wreath above the mantel.
const wreath=new THREE.Group();
wreath.position.set(0,4.05,.02);
fireplace.add(wreath);
addMesh(wreath,new THREE.TorusGeometry(.48,.055,8,48),
 material(0x174f42,.95),[0,0,0]);
for(let i=0;i<42;i++){
 const a=i/42*Math.PI*2;
 const x=Math.cos(a)*.48,y=Math.sin(a)*.48;
 brushRibbon(wreath,[
  [x*.82,y*.82,.04],
  [x+Math.cos(a+.55)*.13,y+Math.sin(a+.55)*.13,.08],
  [x+Math.cos(a+.95)*.22,y+Math.sin(a+.95)*.22,.06]
 ],rand(.025,.055),[0x1a604b,0x32815e,0x72966d][i%3],
 {steps:6,ridge:.015,taper:.8});
 if(i%7===0){
  addMesh(wreath,new THREE.SphereGeometry(.055,8,7),
   material(0xc83f43,.45,.05,0x8d2020,.15),[x*1.08,y*1.08,.10]);
 }
}
paintStrokeLine(wreath,[[-.22,-.55,.12],[0,-.72,.14],[.22,-.55,.12]],0xc74743,.045);

// -------------------------
// Arched window on the right: painted night beyond,
// with thick wooden frame and soft curtains.
// -------------------------
const windowGroup=new THREE.Group();
windowGroup.position.set(4.35,3.05,-2.05);
roomProps.add(windowGroup);

// Window glass: deep blue, with a painted arch silhouette.
addMesh(windowGroup,new THREE.BoxGeometry(2.75,3.55,.12),
 material(0x172b50,.7),[0,0,0]);
// Warm inner border and wooden frame.
for(const x of [-1.48,1.48]){
 paintedBlock(windowGroup,[x,0,.13],[.20,3.85,.32],0x795343,0xc08b5e);
}
paintedBlock(windowGroup,[0,1.90,.13],[3.15,.22,.32],0x795343,0xc08b5e);
paintedBlock(windowGroup,[0,-1.90,.13],[3.15,.22,.32],0x795343,0xc08b5e);
paintedBlock(windowGroup,[0,0,.18],[.14,3.65,.18],0x93684d,0xd3a06a);
paintedBlock(windowGroup,[0,0,.18],[2.85,.14,.18],0x93684d,0xd3a06a);

// Painted window sky swirls and little stars.
for(let i=0;i<7;i++){
 const y=-1.35+i*.43;
 const pts=[];
 for(let j=0;j<=18;j++){
  const t=j/18;
  pts.push([-1.25+t*2.5,y+.10*Math.sin(t*Math.PI*2+i*.7),.115]);
 }
 paintStrokeLine(windowGroup,pts,i%2?0x6b91b0:0xb1a77e,.018);
}
for(let i=0;i<13;i++){
 const x=rand(-1.22,1.22),y=rand(-1.45,1.45);
 addMesh(windowGroup,new THREE.SphereGeometry(.025,6,5),
  new THREE.MeshBasicMaterial({color:i%3?0xd7d5b6:0xf1cf79}),[x,y,.16]);
}
// Curtain folds as broad, soft painted strokes.
for(let side of [-1,1]){
 for(let i=0;i<5;i++){
  const x=side*(1.55+i*.07);
  brushRibbon(windowGroup,[
   [x,1.72,.25],[x-side*.10,.65,.27],[x+side*.05,-.45,.27],
   [x+side*.20,-1.75,.25]
  ],.055,i%2?0x7c4c56:0x9d6261,{steps:10,ridge:.025,taper:.85});
 }
}

// -------------------------
// Rug under the tree: warm, painterly circular textile.
// -------------------------
const rug=new THREE.Group();rug.position.set(0,-.565,.15);scene.add(rug);
const rugMat=material(0x773e48,.98);
const rugDisc=addMesh(rug,new THREE.CircleGeometry(3.65,80),rugMat,[0,0,0]);
rugDisc.rotation.x=-Math.PI/2;
rugDisc.scale.set(1.12,.72,1);
for(let ring=0;ring<3;ring++){
 const pts=[];
 for(let i=0;i<=100;i++){
  const a=i/100*Math.PI*2;
  const r=3.38-ring*.16;
  pts.push([Math.cos(a)*r,0.012+ring*.002,Math.sin(a)*r*.72]);
 }
 paintStrokeLine(rug,pts,ring===1?0xd7a45f:0xe1c28a,.025);
}
for(let i=0;i<65;i++){
 const a=i/65*Math.PI*2;
 const r=rand(2.9,3.45);
 brushRibbon(rug,[
  [Math.cos(a)*r,.02,Math.sin(a)*r*.72],
  [Math.cos(a+.08)*(r+.12),.025,Math.sin(a+.08)*(r+.12)*.72]
 ],.018,i%2?0xd6ad78:0x9b6b63,{steps:5,ridge:.008});
}

// -------------------------
// Wrapped gifts around the foot of the tree.
// -------------------------
function giftBox(x,z,w,h,d,paper,ribbonColor,tilt=0){
 const g=new THREE.Group();g.position.set(x,-.34,z);g.rotation.y=tilt;roomProps.add(g);
 addMesh(g,new THREE.BoxGeometry(w,h,d),material(paper,.84),[0,h/2,0]);
 // Crossed ribbon bands
 paintedBlock(g,[0,h/2,d/2+.012],[w*.13,h+.025,.035],ribbonColor,0xf3dba4);
 paintedBlock(g,[0,h+.012,0],[w+.025,.035,d*.13],ribbonColor,0xf3dba4);
 // Painted bow loops
 paintStrokeLine(g,[[-.08,h+.04,0],[ -.25,h+.18,.02],[-.32,h+.12,.02],[-.08,h+.04,0]],ribbonColor,.025);
 paintStrokeLine(g,[[.08,h+.04,0],[.25,h+.18,.02],[.32,h+.12,.02],[.08,h+.04,0]],ribbonColor,.025);
 // Impasto flecks on wrapping paper
 for(let i=0;i<9;i++){
  const px=rand(-w*.42,w*.42),py=rand(.08,h*.9);
  brushRibbon(g,[[px,py,d/2+.02],[px+.07,py+.025,d/2+.025]],
   .012,i%2?0xf0d8ac:0xe5b47d,{steps:4,ridge:.006});
 }
}
giftBox(-1.95,1.05,.82,.60,.72,0x9c3f48,0xe6c36e,-.12);
giftBox(1.88,1.10,.92,.48,.76,0x285f61,0xe4c27a,.14);
giftBox(-1.35,1.92,.62,.82,.58,0xb77a48,0xefe0bd,.08);
giftBox(1.38,2.02,.70,.62,.62,0x6b5278,0xe4c16e,-.10);

// Little candle lanterns near the rug edges.
function floorLantern(x,z){
 const g=new THREE.Group();g.position.set(x,-.55,z);roomProps.add(g);
 addMesh(g,new THREE.BoxGeometry(.42,.55,.42),material(0x73513f,.85),[0,.28,0]);
 addMesh(g,new THREE.BoxGeometry(.31,.43,.31),
  new THREE.MeshBasicMaterial({color:0xffc76c,transparent:true,opacity:.24}),[0,.29,0]);
 for(const y of [.04,.53]){
  addMesh(g,new THREE.BoxGeometry(.48,.055,.48),material(0xb78a54,.65,.15),[0,y,0]);
 }
 glowSprite(g,0,.30,0,1.35,0xffb65d,.45);
}
floorLantern(-2.85,1.55);
floorLantern(2.85,1.40);

// Painterly wall garland draped high across the back of the room.
for(let i=0;i<36;i++){
 const t=i/35,x=-6+t*12;
 const y=5.85-.72*Math.sin(t*Math.PI);
 const z=-3.2;
 brushRibbon(roomProps,[
  [x-.12,y+.08,z],[x,y,z+.025],[x+.12,y-.06,z]
 ],.035,[0x1c5948,0x2e8060,0x678d67][i%3],
 {steps:6,ridge:.014,taper:.85});
 if(i%6===0){
  addMesh(roomProps,new THREE.SphereGeometry(.055,8,7),
   material(i%2?0xc54443:0xe2b75c,.5,.05,0x8d4c20,.12),
   [x,y-.07,z+.04]);
 }
}

// ============================================================
// Warm firelight flicker, fire embers and floating golden dust
// ============================================================
const emberGroup=new THREE.Group();scene.add(emberGroup);
const embers=[];
for(let i=0;i<45;i++){
 const x=rand(-4.8,-2.2),y=rand(.4,3.2),z=rand(1.2,3.8);
 const color=i%3===0?0xffe4a0:0xff9a4d;
 const m=addMesh(emberGroup,new THREE.SphereGeometry(rand(.012,.035),6,5),
  new THREE.MeshBasicMaterial({color}),[x,y,z]);
 embers.push({m,speed:rand(.004,.014),phase:rand(0,8)});
}

// Soft amber glow around the fireplace direction.
glowSprite(scene,-4.2,2.0,2.8,5.4,0xff9c4b,.38);
glowSprite(scene,-3.8,1.1,2.5,3.2,0xffc06b,.28);

// ============================================================
// Gentle snowfall and animation
// ============================================================
const snow=[];
for(let i=0;i<120;i++){
 const m=addMesh(scene,new THREE.SphereGeometry(rand(.012,.028),6,5),
  new THREE.MeshBasicMaterial({color:i%4===0?0xffe1a0:0xe6e9df}),
  [rand(-8,8),rand(0,9),rand(-7,7)]);
 snow.push({m,speed:rand(.003,.012),phase:rand(0,6)});
}

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();
 controls.update();

 // Firelight breathes gently across the foliage.
 hearthLight.intensity=72+Math.sin(t*3.1)*7+Math.sin(t*7.4)*3;
 warmBounce.intensity=35+Math.sin(t*2.2+1)*4;
 softGold.intensity=17+Math.sin(t*1.7)*2;
 hearthFlames.forEach(({mesh,base,phase,mat},i)=>{
  const flicker=1+.10*Math.sin(t*5.2+phase)+.055*Math.sin(t*9.1+i);
  mesh.scale.y=flicker;
  mat.emissiveIntensity=1.0+.38*Math.sin(t*6+phase);
 });

 bulbs.forEach(({b,halo,phase},i)=>{
  const pulse=.72+.28*(.5+.5*Math.sin(t*2.6+phase));
  b.material.emissiveIntensity=1.05+pulse*1.15;
  halo.material.opacity=.35+pulse*.45;
  const s=.30+pulse*.08;halo.scale.set(s,s,s);
 });
 embers.forEach(({m,speed,phase})=>{
  m.position.y+=speed;
  m.position.x+=Math.sin(t+phase)*.002;
  if(m.position.y>4.2){m.position.y=.35;m.position.x=rand(-4.8,-2.2);}
 });
 snow.forEach(({m,speed,phase})=>{
  m.position.y-=speed;
  m.position.x+=Math.sin(t+phase)*.0015;
  if(m.position.y<-.4){m.position.y=9;m.position.x=rand(-8,8);}
 });

 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
