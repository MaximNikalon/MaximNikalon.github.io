@font-face{
  font-family:"Exhibit Song";
  src:url("./a58b3822340846c5.woff") format("woff");
  font-style:normal;
  font-weight:700;
  font-display:swap;
}
:root{
  color-scheme:dark;
  --deep:#0a1e20;
  --ink:#233b36;
  --paper:#e9dfca;
  --gold:#dfba7d;
  --pale:#f4e5c8;
  --muted:#aec0b1;
  --song:"Exhibit Song","Songti SC","Noto Serif CJK SC","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --noise:url("./479bc39d854a3c9c.png");
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-width:300px;color:var(--pale);font:15px/1.65 var(--sans);background:radial-gradient(ellipse at 90% 4%,#294741 0,transparent 46%),radial-gradient(ellipse at 0% 81%,#1a3431 0,transparent 57%),var(--deep);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background:var(--noise) repeat;opacity:.25;pointer-events:none;z-index:-1}
button{color:inherit;font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #eeb86b;outline-offset:4px}
.wrap{width:min(1430px,calc(100% - 88px));margin-inline:auto}
.site-head{background:#142c2cbb;box-shadow:0 1px #a8b39c26,0 12px 55px #081b1a34}
.head{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{display:flex;align-items:center;gap:11px;font:700 18px/1 var(--song);white-space:nowrap;letter-spacing:.18em}
.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:2px;color:#f9e0b7;background:#a44f3d;letter-spacing:0;font:700 23px/1 var(--song);box-shadow:inset 0 0 0 3px #a44f3d,inset 0 0 0 4px #efcb92,0 3px 9px #020d0d45}
.nav{display:flex;gap:clamp(8px,2.65vw,37px);align-items:center}
.nav button{border:0;border-radius:2px;padding:8px 12px;background:none;color:#c2cabb;font-size:14px;white-space:nowrap;transition:background-color .2s,color .2s}
.nav button:hover{background:#7892862c;color:#fff0ce}
.nav button[aria-current=true]{background:#e6c795;color:#263832;font-weight:650;box-shadow:0 3px 12px #0002}
.outline{display:inline-flex;align-items:center;justify-content:center;min-height:37px;padding:6px 13px;border:1px solid #879f8c63;border-radius:3px;background:#284340;color:#f3dbad;font-size:13px;white-space:nowrap;transition:background-color .2s,color .2s}
.outline:hover,.outline[aria-pressed=true]{background:#3a5550;color:#fff2d3}
.hero{display:grid;grid-template-columns:minmax(295px,.76fr) minmax(0,1.64fr);gap:21px;margin-top:26px;align-items:stretch}
.intro{min-width:0;padding:24px 27px 20px;position:relative;isolation:isolate;display:flex;flex-direction:column;color:var(--ink);background:var(--noise) repeat,radial-gradient(ellipse at 0 0,#f7efda 0,transparent 65%),linear-gradient(135deg,#eadfc9,#d7c8ac);border-radius:4px;overflow:hidden;box-shadow:0 13px 35px #0004}
.intro::before{content:"";position:absolute;z-index:-1;inset:auto -10px -5px;height:100px;background:linear-gradient(#e3d7bc00,#e3d7bc2e),url("./65a39bb72f94b4eb.webp") center bottom/cover no-repeat;mix-blend-mode:multiply;opacity:.24;pointer-events:none}
.eyebrow{display:flex;align-items:center;gap:8px;margin:0 0 12px;font:700 13px/1.4 var(--song);color:#754c38;letter-spacing:.15em}
.eyebrow::before{content:"";width:18px;height:2px;background:#a7523d}
h1{font:700 clamp(47px,5.8vw,83px)/1.06 var(--song);color:#203b34;margin:0;white-space:nowrap;letter-spacing:.015em}
h1 span{color:#9f4f39;margin-inline-start:.06em}
.summary{margin:14px 0;max-width:29ch;line-height:1.78;color:#43564a;font-size:14px}
.keywords{display:flex;gap:5px 8px;flex-wrap:wrap}
.keywords span{color:#536356;background:#475f4e12;font-size:12px;white-space:nowrap;padding:2px 6px;border-radius:2px}
.detail{margin:17px 0 14px;padding:13px 0 0;border-top:1px solid #686b5347}
.detail-kicker{margin:0 0 6px;color:#8b5139;font:700 12px/1.4 var(--song);letter-spacing:.16em}
.detail h2{margin:0;color:#254033;font:700 25px/1.28 var(--song);letter-spacing:.025em}
.detail p:last-child{margin:6px 0 0;color:#43564a;line-height:1.7;font-size:14px;max-width:33ch}
.camera{margin-top:auto;padding:11px 12px;position:relative;background:#28453f;color:#f1e4c9;border-radius:4px;box-shadow:0 3px 10px #1a302023}
.camera-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.camera h2{font:700 15px/1.3 var(--song);color:#f1d6a5;margin:0;letter-spacing:.1em}
.camera .outline{background:#49665b;color:#f1e7ce;min-height:28px;padding:3px 8px;font-size:12px}
.camera .outline:hover{background:#5b786b}
.camera-content{display:flex;align-items:center;gap:10px;margin-top:6px}
.camera-guidance,.camera-status{color:#e5e8d4;margin:0;font-size:12px;line-height:1.55}
.camera-status{margin-top:5px;color:#bccebc}
.camera-preview{position:relative;overflow:hidden;flex:0 0 min(35%,100px);aspect-ratio:4/3;border-radius:3px;background:#122b29;border:1px solid #8ca58b60}
.camera-preview video{display:block;width:100%;height:100%;object-fit:fill;transform:scaleX(-1)}
.camera-preview::after{content:"";position:absolute;inset:24%;border:1px dashed #ffe5a7aa;pointer-events:none}
.camera-mark{position:absolute;width:9px;height:9px;border:2px solid #f8da95;border-radius:50%;background:#77bfac;transform:translate(-50%,-50%);z-index:1}
.stage{height:clamp(510px,43vw,600px);min-width:0;position:relative;isolation:isolate;overflow:hidden;border-radius:5px;background:var(--noise) repeat,radial-gradient(ellipse at 51% 42%,#527265 0,#274a44 41%,#143433 68%,#0c2628 100%);box-shadow:0 12px 41px #021011aa}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,#dc9c5559 0,transparent 40%),linear-gradient(129deg,#a6aa7c23 0,transparent 41%);pointer-events:none;z-index:-1}
.stage::after{content:"";position:absolute;inset:auto 0 0;height:35%;background:url("./65a39bb72f94b4eb.webp") center bottom/cover no-repeat;mask-image:linear-gradient(transparent,#000 67%);opacity:.25;pointer-events:none;z-index:-1}
.stage canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:crosshair}
.stage-top,.stage-bottom{position:absolute;z-index:3;left:22px;right:22px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
.stage-top{top:20px}.stage-bottom{bottom:19px}
.stage-title{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;background:#102826db;color:#fae7bc;box-shadow:0 2px 12px #0004;border-radius:3px;font:700 16px/1.35 var(--song);letter-spacing:.08em}
.stage-title::before{content:"";height:6px;width:6px;transform:rotate(45deg);background:#e7b86d}
.stage-bottom span{color:#f0dbb5;text-shadow:0 1px 5px #112724;font-size:13px}
.stage-bottom button{pointer-events:auto;border:0;background:#e9c996;color:#263c32;font-weight:650;box-shadow:0 2px 12px #0004}
.stage-bottom button:hover{background:#f8dda9;color:#19362d}
.pins{position:absolute;inset:0;pointer-events:none;z-index:2}
.pin{position:absolute;pointer-events:auto;transform:translateY(-50%);padding:5px 10px;border:0;border-radius:3px;background:#1f3d36;color:#f3dfb3;font:700 13px/1.4 var(--song);white-space:nowrap;box-shadow:0 4px 16px #0003}
.pin[data-side=left]{transform:translate(-100%,-50%)}
.pin[aria-pressed=true],.pin:hover{background:#e9c996;color:#243e34}
.controls{margin-top:21px;padding:13px 14px 15px;border-radius:5px;background:linear-gradient(120deg,#294741,#203c39);box-shadow:0 9px 24px #0003}
.controls-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 11px}
.controls-head h2{display:flex;align-items:center;gap:8px;margin:0;padding-left:3px;color:#efdaa9;font:700 20px/1.2 var(--song);letter-spacing:.085em}
.controls-head h2::before{content:"";width:14px;height:2px;background:#dea969}
.toggle{display:flex;gap:5px;flex-wrap:wrap}
.toggle button{min-height:27px;padding:2px 8px;font-size:12px}
.options{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:8px}
.option{height:68px;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:3px;padding:6px 9px;color:#f1e4cb;text-align:left;background:#3b5850;font:700 15px/1.28 var(--song);transition:background-color .18s,color .18s,transform .18s}
.option[aria-pressed=true],.option:hover{background:#e9cfaa;color:#263d31}
.option:hover{transform:translateY(-2px)}
.option img{display:block;width:54px;height:51px;object-fit:contain;filter:drop-shadow(0 3px 4px #14202265)}
.foot{padding:12px 1px 20px;display:flex;justify-content:space-between;gap:10px;color:#a9bcb0;font-size:12px;letter-spacing:.035em}
.dialog{width:min(800px,94vw);max-height:94vh;background:#e8dec7;color:#233b36;padding:0;border:0;border-radius:5px}
.dialog::backdrop{background:#061719de}
.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:#eadfc8;position:sticky;top:0}
.dialog-head h2{font:700 21px/1.3 var(--song);margin:0}.dialog img{display:block;width:100%;height:auto}
@media(max-width:1120px){
  .wrap{width:calc(100% - 54px)}.hero{gap:15px}.intro{padding:20px 20px 16px}
  .nav{gap:12px}.option{font-size:14px;gap:7px}.option img{width:42px;height:45px}
}
@media(max-width:795px){
  .wrap{width:calc(100% - 28px)}.head{display:grid;grid-template-columns:1fr auto;gap:0;min-height:0;padding-top:10px}
  .brand{grid-column:1}.head>.outline{grid-column:2;grid-row:1}.nav{grid-column:1/-1;grid-row:2;justify-content:space-between;gap:2px;min-height:50px}
  .nav button{font-size:12px;padding:5px 6px}.hero{grid-template-columns:minmax(0,1fr);gap:11px;margin-top:13px}
  .intro{display:contents}.intro-copy,.detail{background:var(--noise) repeat,linear-gradient(135deg,#f2e7cf,#ded0b5);border-radius:4px;padding:13px 15px;color:var(--ink)}
  .intro-copy{grid-row:1}.camera{grid-row:3}.detail{grid-row:4;margin:0;border:0}
  .eyebrow{margin-bottom:5px;font-size:12px}h1{font-size:clamp(41px,11vw,68px)}.summary{margin:7px 0 9px;max-width:none}
  .detail h2{font-size:22px}.detail p:last-child{max-width:none}
  .stage{grid-row:2;height:clamp(349px,96vw,550px)}.stage-top,.stage-bottom{left:12px;right:12px}
  .stage-top{top:12px}.stage-bottom{bottom:12px}.stage-bottom span,.stage-bottom button{font-size:12px}.pins{display:none}
  .controls{margin-top:12px;padding:10px 8px}.controls-head{flex-wrap:wrap;margin-inline:3px}
  .controls-head h2{font-size:17px}.options{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
  .option{font-size:12px;gap:4px;padding:5px 4px;height:52px}.option img{width:28px;height:33px}.camera-preview{flex-basis:85px}
}
@media(prefers-reduced-motion:reduce){button{transition:none!important}}

.stage-bottom{align-items:flex-end}
.stage-actions{display:flex;gap:5px;pointer-events:auto;align-items:center}
.stage-actions .page-button{padding:6px 9px;background:#17352f;color:#f3d8a6;font-size:12px}
.stage-actions .page-button:hover{background:#36544a;color:#fff1ce}
.stage-actions .page-button:disabled{opacity:.45;cursor:default}
.stage-actions #regather{margin-left:3px}
.camera-head .camera-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.camera-actions #calibrateCamera{background:#3a584e}
@media(max-width:460px){
  .stage-actions .page-button,.stage-actions #regather{padding-inline:6px;min-height:31px}
  .stage-bottom span{font-size:11px;line-height:1.35;max-width:10em}
  .stage-actions{gap:3px}.stage-actions #regather{margin-left:0}
}

<script>

assets.craft1=assets.lantern;
const content = {
  structure: {

    ['节庆观灯','灯彩在节庆中点亮街巷，观灯由此成为可参与的民俗活动。']
  ]},
  heritage:{title:'地域与传承',section:'传承与灯作',items:[
    ['河南开封','展板以地图标出开封，这里是汴京灯笼张的传承地。'],
    ['张氏传承','汴京灯笼张以张氏传承为线索，展板通过材料、工序和灯作记录其灯彩技艺。'],
    ['张俊涛','展板在地域与传承板块中列出张俊涛。']
  ]},
  types:{title:'代表灯作',section:'传承与灯作',items:[
    ['蒺藜灯','以层叠的多尖角构成灯身，轮廓像蒺藜。'],
    ['脸谱灯','灯身以戏曲脸谱为造型，强调面部色块和表情。'],
    ['凤凰戏牡丹灯','以凤凰和牡丹组织灯面图案，展现花鸟题材。'],
    ['宣纸竹篾灯','展板中的这一灯作同时呈现灯面图案与竹篾框架。']
  ]}
};
const canvas = document.querySelector('#canvas');
const context = canvas.getContext('2d');
const options = document.querySelector('#options');
const pins = document.querySelector('#pins');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const coarse = matchMedia('(pointer: coarse)');
const photos = {};
const samples = new Map();
const particleCount = 9200;
const particles = Array.from({length:particleCount},(_,i)=>({
  x:0,y:0,vx:0,vy:0,fromX:0,fromY:0,nx:0,ny:0,color:i%8,seed:i*.618034,size:1.35+Math.random()*1.22
}));
const dust = Array.from({length:105},()=>[Math.random(),Math.random(),Math.random()]);
const palette = ['#efc779','#e99c85','#dc7b74','#6b9bda','#f5e5b5','#76c1af','#63a796','#d2a866'];
let mode='structure', processView='process', heritageView='heritage', selected=0, photo=null, points=null, sequence=0;
const gatherDuration = 560;
const stageHint = document.querySelector('#stageHint');
const gatherButton = document.querySelector('#regather');
const previousExhibit=document.querySelector('#previousExhibit');
const nextExhibit=document.querySelector('#nextExhibit');
const exhibitPages=Object.entries(content).flatMap(([view,data])=>
  data.items.map((_,index)=>({view,index})));
const currentPage=()=>exhibitPages.findIndex(page=>page.view===currentView() && page.index===selected);
let w=0,h=0,layout,pointer=null,handPointer=null,lastFrame=0,hasFrame=false;
let gathering=null,artwork=null,wantGather=false,loadingArtwork=false;
const names={types:'type',process:'stage',material:'material',craft:'craft',patterns:'pattern',heritage:'place'};
function currentView(){return mode==='heritage'?heritageView:mode==='process'?processView:mode;}
function structureKey(index){
  return index===0?'lantern':'feature'+(index-1);
}
function updateStageHint(now){
  const hint=loadingArtwork && wantGather?'正在切换展品…':!gathering?'握拳或点击聚合'
    :now<gathering.ready?'粒子聚合中…':'张掌或点击散开';
  if(stageHint.textContent!==hint)stageHint.textContent=hint;
  const buttonLabel=wantGather?'散开粒子':'聚合粒子';
  if(gatherButton.textContent!==buttonLabel)gatherButton.textContent=buttonLabel;
}
function loadPhoto(key){
  if(!photos[key]){
    const photo = new Image();
    photos[key]=new Promise((resolve,reject)=>{
      photo.onload=()=>resolve(photo);
      photo.onerror=error=>{delete photos[key];reject(error);};
      photo.src=assets[key];
    });
  }
  return photos[key];
}
function tone(r,g,b){
  if(b>r*1.13 && b>g*1.16)return 3;
  if(g>r*1.12)return g>148?5:6;
  if(r>222 && g>185 && b>135)return 4;
  if(r>187 && g>140 && b<g*.82)return 0;
  if(r>188 && b>93)return 1;
  if(r>136 && g<r*.8)return 2;
  return 7;
}
function samplePhoto(key,img){
  if(samples.has(key))return samples.get(key);
  const temp=document.createElement('canvas');
  temp.height=370;temp.width=Math.round(370*img.width/img.height);
  const tempContext=temp.getContext('2d',{willReadFrequently:true});
  tempContext.drawImage(img,0,0,temp.width,temp.height);
  const data=tempContext.getImageData(0,0,temp.width,temp.height).data;
  const candidates=[];
  for(let y=0;y<temp.height;y++){
    for(let x=0;x<temp.width;x++){
      const i=(y*temp.width+x)*4;
      if(data[i+3]<180 || data[i]+data[i+1]<165)continue;
      candidates.push([x/temp.width,y/temp.height,tone(data[i],data[i+1],data[i+2])]);
    }
  }
  const result=particles.map(()=>candidates[Math.floor(Math.random()*candidates.length)] ?? [.5,.5,0]);
  samples.set(key,result);
  return result;
}
function randomizePosition(p){
  const angle=Math.random()*Math.PI*2;
  const radius=Math.sqrt(Math.random());
  p.x=w*(.5+Math.cos(angle)*radius*.34);
  p.y=h*(.5+Math.sin(angle)*radius*.35);
}
function setLayout(){
  const box=canvas.getBoundingClientRect();
  if(box.width===0 || box.height===0)return;
  const oldWidth=w,oldHeight=h;
  w=box.width;h=box.height;
  if(w!==oldWidth || h!==oldHeight){
    for(const p of particles){
      if(oldWidth){p.x*=w/oldWidth;p.y*=h/oldHeight;}
      else randomizePosition(p);
      p.fromX=oldWidth?p.fromX*w/oldWidth:p.x;
      p.fromY=oldHeight?p.fromY*h/oldHeight:p.y;
      if(!oldWidth)setDrift(p);
    }
  }
  const ratio=Math.min(devicePixelRatio||1,2);
  const widthPx=Math.round(w*ratio),heightPx=Math.round(h*ratio);
  if(canvas.width!==widthPx || canvas.height!==heightPx){
    canvas.width=widthPx;canvas.height=heightPx;
    context.setTransform(ratio,0,0,ratio,0,0);
  }
  const view=currentView();
  const aspect=photo?photo.width/photo.height:1.45;
  const maxHeight=h*(view==='structure'?.85:.70);
  const width=Math.min(w*(view==='structure'?.66:.76),maxHeight*aspect);
  const height=width/aspect;
  layout={x:(w-width)/2,y:(h-height)/2,width,height};
  if(points)aim();
  updatePins();
  frame(performance.now());
}
function aim(){
  particles.forEach((p,i)=>{
    const [x,y,color]=points[i];
    p.nx=layout.x+x*layout.width;
    p.ny=layout.y+y*layout.height;
    p.color=color;
  });
}
function setDrift(p){
  const angle=Math.random()*Math.PI*2;
  const speed=.22+Math.random()*.66;
  p.vx=Math.cos(angle)*speed;
  p.vy=Math.sin(angle)*speed;
}
function startGathering(sameArtwork){
  const now=performance.now();
  const alreadyShown=sameArtwork && gathering && now>=gathering.ready;
  for(const p of particles){
    p.fromX=p.x;
    p.fromY=p.y;
  }
  const ready=now+(reduced.matches || alreadyShown?0:gatherDuration);
  gathering={started:ready-gatherDuration,ready};
  updatePins();
  updateStageHint(now);
  startAnimation();
}
function scatter(){
  wantGather=false;
  if(!gathering){
    updateStageHint(performance.now());
    return;
  }
  gathering=null;
  for(const p of particles){
    setDrift(p);
    const dx=p.x-w/2,dy=p.y-h/2;
    const length=Math.hypot(dx,dy)||1;
    const push=2.4+Math.random()*3.5;
    p.vx+=dx/length*push;
    p.vy+=dy/length*push;
    if(reduced.matches){
      randomizePosition(p);
    }
  }
  updatePins();
  updateStageHint(performance.now());
  startAnimation();
}
function pageArt(view,index){
  return view==='structure'?structureKey(index):names[view]+index;
}
async function switchArt(view,activate=true){
  const token=++sequence;
  const key=pageArt(view,selected);
  loadingArtwork=artwork!==key;
  if(activate)wantGather=true;
  if(loadingArtwork && gathering){
    const shouldGather=wantGather;
    scatter();
    wantGather=shouldGather;
  }
  updateStageHint(performance.now());
  try{
    const img=await loadPhoto(key);
    if(token!==sequence)return;
    photo=img;
    points=samplePhoto(key,img);
  }catch{
    if(token===sequence){
      loadingArtwork=false;wantGather=false;
      updateStageHint(performance.now());
    }
    return;
  }
  loadingArtwork=false;
  if(wantGather)startGathering(artwork===key);
  artwork=key;
  setLayout();
  for(const neighbor of [currentPage()-1,currentPage()+1]){
    const page=exhibitPages[neighbor];
    if(page)loadPhoto(pageArt(page.view,page.index)).catch(()=>{});
  }
}
function backdropFacet(radius,fill){
  context.beginPath();
  for(let i=0;i<8;i++){
    const angle=Math.PI*(i/4+.125);
    const x=w/2+radius*Math.cos(angle),y=h/2+radius*Math.sin(angle);
    if(i===0)context.moveTo(x,y);
    else context.lineTo(x,y);
  }
  context.closePath();
  context.fillStyle=fill;
  context.fill();
}
function ring(radius,start,end,color,width=1){
  context.beginPath();
  context.arc(w*.5,h*.5,radius,start,end);
  context.strokeStyle=color;
  context.lineWidth=width;
  context.stroke();
}
function background(time){
  context.clearRect(0,0,w,h);
  const radius=Math.min(w*.395,h*.394);
  context.save();
  backdropFacet(radius+44,'#dec28c2b');
  backdropFacet(radius+14,'#24372a6a');
  ring(radius+4,-2.74,-2.20,'#d8b58290',1.4);
  ring(radius+4,.36,1.03,'#d8b58275',1.4);
  for(const [x,y,n] of dust){
    context.globalAlpha=.12+(.5+.5*Math.sin(time*.0007+n*50))*.42;
    context.fillStyle=n>.8?'#ffd49b':'#d48945';
    const size=n>.93?2.2:1;
    context.fillRect(x*w,(y*h+(time*.005*n)%h)%h,size,size);
  }
  context.restore();
}
function drawPins(){
  if(currentView()!=='structure'||selected!==0||w<=580)return;
  const items=content.structure.items.slice(1);
  items.forEach((item,index)=>{
    const [, ,nx,ny,side,bx,by]=item;
    const x=layout.x+nx*layout.width,y=layout.y+ny*layout.height;
    const endX=bx*w,endY=by*h;
    const joint=endX+(side==='left'?19:-19);
    context.strokeStyle=index===selected?'#ffd087bd':'#d496526b';
    context.lineWidth=index===selected?1.25:.8;
    context.beginPath();
    context.moveTo(x,y);context.lineTo(joint,y);context.lineTo(joint,endY);context.lineTo(endX,endY);
    context.stroke();
    context.beginPath();
    context.arc(x,y,index===selected?4:2.6,0,Math.PI*2);
    context.fillStyle=index===selected?'#ffdc99':'#c78649';context.fill();
  });
}
function drift(p,now,step){
  if(reduced.matches)return;
  const angle=now*.00066+p.seed*9;
  p.vx=p.vx*Math.pow(.986,step)+Math.cos(angle)*.014*step;
  p.vy=p.vy*Math.pow(.986,step)+Math.sin(angle)*.014*step;
  const influence=handPointer??pointer;
  if(influence){
    const dx=p.x-influence.x,dy=p.y-influence.y;
    const distance=Math.hypot(dx,dy);
    if(distance>0 && distance<62){
      const force=(1-distance/62)*(handPointer?.51:.26)*step;
      p.vx+=dx/distance*force;
      p.vy+=dy/distance*force;
    }
  }
  const dx=(p.x-w/2)/(w*.35),dy=(p.y-h/2)/(h*.36);
  const edge=Math.hypot(dx,dy);
  if(edge>1){
    p.vx-=dx*Math.min(edge-1,1)*.42*step;
    p.vy-=dy*Math.min(edge-1,1)*.42*step;
  }
  p.x=Math.max(1,Math.min(w-1,p.x+p.vx*step));
  p.y=Math.max(1,Math.min(h-1,p.y+p.vy*step));
}
function frame(now){
  if(!layout)return;
  const step=Math.min(Math.max((now-lastFrame)/16.67,0),2);
  lastFrame=now;
  updateStageHint(now);
  const time=reduced.matches?0:now;
  background(time);
  const progress=gathering
    ?reduced.matches?1:Math.min(Math.max((now-gathering.started)/gatherDuration,0),1)
    :0;
  const blend=1-Math.pow(1-progress,3);
  if(photo && gathering && progress>.45){
    context.save();
    context.globalAlpha=.98*Math.min((progress-.45)/.55,1);
    context.drawImage(photo,layout.x,layout.y,layout.width,layout.height);
    context.restore();
  }
  const scale=w<510?.76:1;
  context.globalAlpha=gathering?.93-.55*progress:.56;

  for(let color=0;color<palette.length;color++){
    context.fillStyle=palette[color];
    context.beginPath();
    for(const p of particles){
      if(p.color!==color)continue;
      if(gathering){
        p.x=p.fromX+(p.nx-p.fromX)*blend;
        p.y=p.fromY+(p.ny-p.fromY)*blend;
      }else{
        drift(p,now,step);
      }
      const shimmer=reduced.matches?0:Math.sin(time*.0018+p.seed)*.34;
      const size=(p.size+shimmer)*scale;
      const radius=size*.52;
      context.moveTo(p.x+radius,p.y);
      context.arc(p.x,p.y,radius,0,Math.PI*2);
    }
    context.fill();
  }
  context.globalAlpha=1;
  if(gathering && progress>=1)drawPins();
}
function animate(now){
  hasFrame=false;
  frame(now);
  if(!reduced.matches && !document.hidden)startAnimation();
}
function startAnimation(){
  if(hasFrame)return;
  hasFrame=true;
  requestAnimationFrame(animate);
}
function makeButton(label,index,css){
  const button=document.createElement('button');
  button.type='button';button.className=css;button.dataset.index=index;
  button.setAttribute('aria-pressed',String(index===selected));
  button.textContent=label;
  return button;
}
function updatePins(){
  pins.hidden=!gathering || currentView()!=='structure' || selected!==0 || w<=580;
  if(pins.hidden)return;
  if(pins.childElementCount===0){
    content.structure.items.slice(1).forEach((item,index)=>{
      const button=makeButton(item[0],index+1,'pin');
      button.dataset.side=item[4];
      button.style.left=item[5]*100+'%';button.style.top=item[6]*100+'%';
      pins.append(button);
    });

}
function renderSelection(rebuild){
  const view=currentView();
  const data=content[view];
  const position=currentPage();
  previousExhibit.disabled=position===0;
  nextExhibit.disabled=position===exhibitPages.length-1;

  document.querySelector('#detailTitle').textContent=label;

  document.querySelector('#controlsTitle').textContent=data.title;
  document.querySelector('#heritageToggle').hidden=mode!=='heritage';
  document.querySelector('#processToggle').hidden=mode!=='process';
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.mode===mode)));
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));
  if(rebuild){
    options.style.setProperty('--cols',data.items.length);
    options.replaceChildren();
    data.items.forEach(([name],index)=>{
      const button=makeButton(name,index,'option');
      const label=document.createElement('span');
      label.textContent=name;
      const thumb=document.createElement('img');
      const assetKey=view==='structure'?structureKey(index):names[view]+index;
      thumb.src=assets[assetKey];
      thumb.alt='';
      thumb.draggable=false;
      button.replaceChildren(thumb,label);
      options.append(button);
    });
  }
  updatePins();
  document.querySelectorAll('[data-index]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.index)===selected)));
}
function choose(index){
  selected=index;
  renderSelection(false);
  switchArt(currentView());
}
document.querySelector('.nav').addEventListener('click',event=>{
  const button=event.target.closest('[data-mode]');
  if(!button)return;

for(const toggle of document.querySelectorAll('.toggle')){

    if(!button)return;

}
for(const list of [options,pins]){
  list.addEventListener('click',event=>{
    const button=event.target.closest('[data-index]');
    if(button)choose(Number(button.dataset.index));
  });
}
function relativePointer(event){
  const rect=canvas.getBoundingClientRect();
  return {x:event.clientX-rect.left,y:event.clientY-rect.top};
}
canvas.addEventListener('pointermove',event=>{if(event.pointerType==='mouse')pointer=relativePointer(event);});
canvas.addEventListener('pointerleave',()=>{pointer=null;});
function toggleGathering(){
  if(wantGather)scatter();
  else switchArt(currentView());
}
canvas.addEventListener('click',toggleGathering);
gatherButton.addEventListener('click',toggleGathering);
const dialog=document.querySelector('#sourceDialog');
document.querySelector('#openSource').addEventListener('click',()=>{
  dialog.querySelector('img').src=assets.source;
  dialog.showModal();
});
reduced.addEventListener('change',()=>{renderSelection(false);startAnimation();});
coarse.addEventListener('change',()=>{updateStageHint(performance.now());});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)startAnimation();});
new ResizeObserver(setLayout).observe(canvas);
renderSelection(true);
switchArt('structure',false);
startAnimation();
const cameraButton=document.querySelector('#cameraButton');
const cameraStatus=document.querySelector('#cameraStatus');
const calibrateCamera=document.querySelector('#calibrateCamera');
const cameraPreview=document.querySelector('#cameraPreview');
const cameraVideo=document.querySelector('#cameraVideo');
const handMark=document.querySelector('#handMark');

function makeHandTracker(){
  const columns=112,rows=84,area=columns*rows;
  const input=document.createElement('canvas');
  input.width=columns;input.height=rows;
  const detector=input.getContext('2d',{willReadFrequently:true});
  const reference=new Float32Array(area*3);
  const changed=new Uint8Array(area);
  const mask=new Uint8Array(area);
  const queue=new Int32Array(area);
  let previousCenter=null;
  let calibration=0;
  return function locateHand(video){
    detector.drawImage(video,0,0,columns,rows);
    const pixels=detector.getImageData(0,0,columns,rows).data;
    let exposure=0,variation=0;
    for(let i=0;i<area;i+=4){
      const delta=pixels[i*4+1]-reference[i*3+1];
      exposure+=delta;
      variation+=Math.abs(delta);
    }
    exposure/=area/4;
    variation/=area/4;
    const uniformShift=Math.abs(exposure)>12 && Math.abs(exposure)>variation*.73;
    const learning=calibration<10 || uniformShift;
    for(let i=0;i<area;i++){
      const rgb=i*4,base=i*3;
      const r=pixels[rgb],g=pixels[rgb+1],b=pixels[rgb+2];
      const rr=r-reference[base],gg=g-reference[base+1],bb=b-reference[base+2];
      const distance=Math.abs(rr-gg)*.45+Math.abs(bb-gg)*.26+Math.abs((rr+gg+bb)/3)*.60;
      changed[i]=!learning && distance>17?1:0;
      const rate=calibration===0?1:learning?.26:changed[i]?.002:.034;
      reference[base]+=rr*rate;reference[base+1]+=gg*rate;reference[base+2]+=bb*rate;
    }
    calibration++;
    if(learning){previousCenter=null;return {calibrating:true};}
    mask.fill(0);
    for(let y=1;y<rows-1;y++){
      for(let x=1;x<columns-1;x++){
        const i=y*columns+x;
        mask[i]=changed[i] && changed[i-1]+changed[i+1]+changed[i-columns]+changed[i+columns]>=2?1:0;
      }
    }
    let largest=null,largestCells=null,bestScore=0;
    for(let i=columns+1;i<area-columns-1;i++){
      if(!mask[i])continue;
      let head=0,tail=1,sumX=0,sumY=0,minX=columns,maxX=0,minY=rows,maxY=0;
      mask[i]=0;
      queue[0]=i;
      while(head<tail){
        const cell=queue[head++],x=cell%columns,y=Math.floor(cell/columns);
        sumX+=x;sumY+=y;
        minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);
        for(const neighbor of [cell-1,cell+1,cell-columns,cell+columns]){
          if(!mask[neighbor])continue;
          mask[neighbor]=0;queue[tail++]=neighbor;
        }
      }
      if(tail<area*.016 || tail>area*.32 || maxX-minX<10 || maxY-minY<11)continue;
      const x=1-sumX/tail/columns,y=sumY/tail/rows;
      if(x<.075 || x>.925 || y<.10 || y>.86)continue;
      const distance=previousCenter?Math.hypot(x-previousCenter.x,y-previousCenter.y):Math.abs(y-.59);
      const score=tail/(1+distance*4);
      if(score>bestScore){
        bestScore=score;
        largest={x,y,size:tail};
        largestCells=queue.slice(0,tail);
      }
    }
    if(largest){
      largest.gesture=classifyHand(largestCells,largest.size,columns,(1-largest.x)*columns,largest.y*rows);
    }
    previousCenter=largest;
    return {hand:largest};
  };
}

function classifyHand(cells,count,columns,centerX,centerY){
  let strongest=0,split=0,tallSplit=0,maxFill=0;
  const rowMask=new Uint8Array(192);
  const rotatedX=new Float32Array(count),rotatedY=new Float32Array(count);
  for(const angle of [0,-.42,.42,-.74,.74]){
    const cos=Math.cos(angle),sin=Math.sin(angle);
    let left=Infinity,right=-Infinity,top=Infinity,bottom=-Infinity;
    for(let i=0;i<count;i++){
      const cell=cells[i];
      const dx=cell%columns-centerX,dy=Math.floor(cell/columns)-centerY;
      const x=dx*cos-dy*sin,y=dx*sin+dy*cos;
      rotatedX[i]=x;rotatedY[i]=y;
      left=Math.min(left,x);right=Math.max(right,x);
      top=Math.min(top,y);bottom=Math.max(bottom,y);
    }
    const width=Math.ceil(right-left)+1,height=bottom-top+1;
    const minFinger=Math.max(2,Math.round(width*.047));
    let two=0,three=0,upperTwo=0,sectionArea=0;
    for(let i=0;i<count;i++)if(rotatedY[i]<top+height*.72)sectionArea++;
    maxFill=Math.max(maxFill,sectionArea/(width*height*.72));
    for(const band of [.14,.21,.28,.35,.42,.49]){
      const y=top+height*band;
      rowMask.fill(0);
      for(let i=0;i<count;i++){
        if(Math.abs(rotatedY[i]-y)<=.72)rowMask[Math.round(rotatedX[i]-left)]=1;
      }
      let countRuns=0,lastEnd=-width;
      for(let x=0;x<width;){
        if(!rowMask[x]){x++;continue;}
        const first=x;
        while(x<width && rowMask[x])x++;
        if(x-first<minFinger)continue;
        if(first-lastEnd>=minFinger)countRuns++;
        lastEnd=x;
      }
      if(countRuns>=2){
        two++;
        if(band<=.35)upperTwo++;
      }
      if(countRuns>=3)three++;
    }
    strongest=Math.max(strongest,three);
    split=Math.max(split,two);
    tallSplit=Math.max(tallSplit,upperTwo);
  }
  if(strongest>=2)return 'open';
  if(tallSplit>=2 && split>=3)return null;
  if(split<3 && maxFill>=.49)return 'fist';
  return null;
}

function makeGestureDetector(onGesture){
  let candidate=null,candidateAt=0,stable=null,seenAt=0;
  return function readGesture(hand,now){
    const gesture=hand?.gesture;
    if(!gesture){
      if(now-seenAt>210){candidate=null;stable=null;}
      else if(now-seenAt>100)candidate=null;
      return stable;
    }
    if(candidate!==gesture || now-seenAt>105){
      candidate=gesture;candidateAt=now;
    }
    seenAt=now;
    if(gesture!==stable && now-candidateAt>=65){
      stable=gesture;
      onGesture(stable);
    }
    return stable;
  };
}

function moveExhibitPage(direction){
  const view=currentView();
  const position=currentPage();
  const next=exhibitPages[position+direction];
  if(!next)return false;
  const nextMode=next.view==='material'||next.view==='craft'?'process'
    :next.view==='types'?'heritage':next.view;
  if(nextMode==='process')processView=next.view;
  if(nextMode==='heritage')heritageView=next.view;
  mode=nextMode;
  selected=next.index;
  renderSelection(next.view!==view);
  switchArt(next.view);
  return true;
}

previousExhibit.addEventListener('click',()=>moveExhibitPage(-1));
nextExhibit.addEventListener('click',()=>moveExhibitPage(1));
document.addEventListener('keydown',event=>{
  if(dialog.open || event.altKey || event.ctrlKey || event.metaKey || event.repeat)return;
  if(event.key!=='ArrowLeft' && event.key!=='ArrowRight')return;
  if(moveExhibitPage(event.key==='ArrowRight'?1:-1))event.preventDefault();
});
let cameraStream=null,cameraTimer=null,cameraAttempt=0,cameraRequest=false;
let gestureMessage='',gestureMessageUntil=0;
function handleGesture(gesture){
  if(gesture==='open'){
    scatter();
    gestureMessage='已张掌 · 粒子散开';
  }else if(gesture==='fist'){
    if(!wantGather)switchArt(currentView());
    gestureMessage='已握拳 · 粒子聚合';
  }
  gestureMessageUntil=performance.now()+820;
}
function stopCamera(showStatus=true){
  cameraAttempt++;
  cameraRequest=false;
  clearInterval(cameraTimer);cameraTimer=null;
  if(cameraStream)cameraStream.getTracks().forEach(track=>track.stop());
  cameraStream=null;cameraVideo.srcObject=null;
  cameraPreview.hidden=true;calibrateCamera.hidden=true;handMark.hidden=true;handPointer=null;
  cameraButton.textContent='启用摄像头';
  cameraButton.setAttribute('aria-pressed','false');
  if(showStatus)cameraStatus.textContent='摄像头已关闭，可以点击展台继续互动。';
}
function cameraError(error){
  if(error.name==='NotAllowedError'||error.name==='SecurityError')return '摄像头权限未开启。请在浏览器允许后重试。';
  if(error.name==='NotFoundError'||error.name==='DevicesNotFoundError')return '未检测到摄像头，仍可用鼠标或触屏。';
  if(error.name==='NotReadableError'||error.name==='TrackStartError')return '摄像头可能正被其他软件占用。';
  return '摄像头启动失败，仍可用鼠标或触屏。';
}
function trackCamera(){
  clearInterval(cameraTimer);
  const locateHand=makeHandTracker();
  const readGesture=makeGestureDetector(handleGesture);
  let status='',lastVideoTime=-1;
  gestureMessageUntil=0;
  handMark.hidden=true;handPointer=null;
  cameraStatus.textContent='正在校准，请暂时把手移出画面。';
  cameraTimer=setInterval(()=>{
    if(cameraVideo.readyState<2 || document.hidden || cameraVideo.currentTime===lastVideoTime)return;
    lastVideoTime=cameraVideo.currentTime;
    try{
      const now=performance.now();
      const {calibrating,hand}=locateHand(cameraVideo);
      const gesture=readGesture(calibrating?null:hand,now);
      const next=calibrating?'正在校准，请暂时把手移出画面。'
        :now<gestureMessageUntil?gestureMessage
        :!hand?'把一只手伸到取景框内。'
        :gesture==='fist'?'已握拳 · 粒子聚合'
        :gesture==='open'?'已张掌 · 粒子散开'
        :'请手心朝镜头，停一下再换手势。';
      if(next!==status){cameraStatus.textContent=next;status=next;}
      handMark.hidden=!hand;
      handPointer=hand?{x:hand.x*w,y:hand.y*h}:null;
      if(hand){
        handMark.style.left=hand.x*100+'%';
        handMark.style.top=hand.y*100+'%';
      }
    }catch{
      stopCamera(false);
      cameraStatus.textContent='无法读取摄像头画面，仍可用鼠标或触屏。';
    }
  },36);
}
async function toggleCamera(){
  if(cameraStream || cameraRequest){stopCamera();return;}
  if(!navigator.mediaDevices?.getUserMedia){
    cameraStatus.textContent='当前页面无法使用摄像头。请下载后用电脑浏览器打开。';
    return;
  }
  cameraRequest=true;
  const attempt=++cameraAttempt;
  cameraButton.textContent='取消启用';
  cameraStatus.textContent='等待摄像头授权…';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      audio:false,video:{width:{ideal:640},height:{ideal:480},facingMode:'user'}
    });
    if(attempt!==cameraAttempt){
      stream.getTracks().forEach(track=>track.stop());
      return;
    }
    cameraStream=stream;
    cameraVideo.srcObject=stream;
    await cameraVideo.play();
    if(attempt!==cameraAttempt)return;
    cameraRequest=false;
    cameraPreview.hidden=false;
    calibrateCamera.hidden=false;
    cameraButton.textContent='关闭摄像头';
    cameraButton.setAttribute('aria-pressed','true');
    cameraStatus.textContent='正在取景，请先把手移出画面。';
    for(const track of stream.getVideoTracks()){
      track.addEventListener('ended',()=>{
        if(stream!==cameraStream)return;
        stopCamera(false);
        cameraStatus.textContent='摄像头已断开，仍可用鼠标或触屏。';
      },{once:true});
    }
    trackCamera();
  }catch(error){
    if(attempt!==cameraAttempt)return;
    stopCamera(false);
    cameraStatus.textContent=cameraError(error);
  }
}
cameraButton.addEventListener('click',toggleCamera);
calibrateCamera.addEventListener('click',()=>{if(cameraStream)trackCamera();});
window.addEventListener('pagehide',()=>stopCamera(false));
window.addEventListener('load',()=>{
  if(!cameraStream && !cameraRequest && cameraAttempt===0)void toggleCamera();
},{once:true});

</script>
